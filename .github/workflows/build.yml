name: ScreenTextCopier Build & Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Ensure gradlew is executable
        run: chmod +x gradlew || true

      - name: Build Debug and Release APKs
        run: |
          gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Package Artifacts and Compute Checksums
        id: package_artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/ScreenTextCopier-debug.apk
          cp app/build/outputs/apk/release/app-release.apk artifacts/ScreenTextCopier-release.apk
          (cd artifacts && sha256sum *.apk > SHA256SUMS)

          echo "### ScreenTextCopier Build Summary 🚀" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| File | SHA-256 Checksum |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r line; do
            hash=$(echo "$line" | awk '{print $1}')
            name=$(echo "$line" | awk '{print $2}')
            echo "| \`$name\` | \`$hash\` |" >> "$GITHUB_STEP_SUMMARY"
          done < artifacts/SHA256SUMS

      - name: Upload APKs as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTextCopier-APKs
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: ScreenTextCopier v1.0.0 (Build #${{ github.run_number }})
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/ScreenTextCopier-debug.apk
            artifacts/ScreenTextCopier-release.apk
            artifacts/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
