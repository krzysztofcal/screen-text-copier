name: ScreenTextCopier Build & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Ensure gradlew and scripts are executable
        run: |
          chmod +x gradlew || true
          chmod +x scripts/*.sh || true

      - name: Restore Release Keystore from Secrets (Release Tag Only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_SIGNER_SHA256: ${{ secrets.RELEASE_SIGNER_SHA256 }}
        run: |
          set -euo pipefail

          # 1. Fail-closed if any required secret is missing
          if [ -z "$RELEASE_KEYSTORE_BASE64" ] || \
             [ -z "$RELEASE_KEYSTORE_PASSWORD" ] || \
             [ -z "$RELEASE_KEY_ALIAS" ] || \
             [ -z "$RELEASE_KEY_PASSWORD" ] || \
             [ -z "$RELEASE_SIGNER_SHA256" ]; then
            echo "::error::Release build failed: One or more required release signing secrets (RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD, RELEASE_SIGNER_SHA256) are missing or empty! Release publication blocked (fail-closed)."
            exit 1
          fi

          # 2. Securely decode keystore into isolated temp directory outside workspace
          KEYSTORE_DIR="${RUNNER_TEMP}/keystore"
          mkdir -p "$KEYSTORE_DIR"
          chmod 700 "$KEYSTORE_DIR"
          KEYSTORE_FILE="$KEYSTORE_DIR/release.p12"

          (umask 077 && echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE")
          chmod 600 "$KEYSTORE_FILE"

          echo "RELEASE_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "Keystore successfully restored to secure runner temporary directory."

      - name: Run Unit Tests and Build APKs
        env:
          RELEASE_KEYSTORE_PATH: ${{ env.RELEASE_KEYSTORE_PATH || '' }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          gradle testDebugUnitTest assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Validate Built Release APK Signature (Release Tag Only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$RELEASE_APK" ]; then
            echo "::error::Signed release APK ($RELEASE_APK) was not generated by Gradle! Release build failed-closed."
            exit 1
          fi
          EXPECTED_SHA256="${{ secrets.RELEASE_SIGNER_SHA256 }}"
          ./scripts/verify-apk-signature.sh "$RELEASE_APK" "$EXPECTED_SHA256"

      - name: Cleanup Release Keystore
        if: always()
        run: |
          rm -rf "${RUNNER_TEMP}/keystore"

      - name: "Test APK Signature Validation Suite (Cases: Valid, Unsigned, Wrong Cert, Missing Cert)"
        run: |
          ./scripts/test-apk-signature-validation.sh app/build/outputs/apk/debug/app-debug.apk

      - name: Package Artifacts and Compute Checksums
        id: package_artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/ScreenTextCopier-debug.apk

          # On a release tag, signed release APK is mandatory (fail-closed)
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            if [ ! -f app/build/outputs/apk/release/app-release.apk ]; then
              echo "::error::Release build failed: app/build/outputs/apk/release/app-release.apk was not found! (fail-closed)"
              exit 1
            fi
            cp app/build/outputs/apk/release/app-release.apk artifacts/ScreenTextCopier-release.apk
          elif [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk artifacts/ScreenTextCopier-release.apk
          fi

          (cd artifacts && sha256sum *.apk > SHA256SUMS)

          echo "### ScreenTextCopier Build Summary 🚀" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| File | SHA-256 Checksum |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r line; do
            hash=$(echo "$line" | awk '{print $1}')
            name=$(echo "$line" | awk '{print $2}')
            echo "| \`$name\` | \`$hash\` |" >> "$GITHUB_STEP_SUMMARY"
          done < artifacts/SHA256SUMS

      - name: Upload APKs as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTextCopier-APKs
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ScreenTextCopier-APKs
          path: artifacts

      - name: Validate Release Signature (Fail-Closed)
        run: |
          set -euo pipefail
          chmod +x scripts/verify-apk-signature.sh

          # 1. Require that signed release APK exists
          RELEASE_APK="artifacts/ScreenTextCopier-release.apk"
          if [ ! -f "$RELEASE_APK" ]; then
            echo "::error::Signed release APK ($RELEASE_APK) does not exist! Release publication blocked (fail-closed)."
            exit 1
          fi

          # 2. Strictly disallow any unsigned APK artifacts in release bundle
          if ls artifacts/*unsigned*.apk 1>/dev/null 2>&1; then
            echo "::error::Unsigned APK found in release artifacts! Release publication blocked (fail-closed)."
            exit 1
          fi

          # 3. Cryptographically verify signature and pin certificate SHA-256
          EXPECTED_SHA256="${{ secrets.RELEASE_SIGNER_SHA256 }}"
          if [ -z "$EXPECTED_SHA256" ]; then
            EXPECTED_SHA256="${{ vars.RELEASE_SIGNER_SHA256 }}"
          fi
          ./scripts/verify-apk-signature.sh "$RELEASE_APK" "$EXPECTED_SHA256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/ScreenTextCopier-release.apk
            artifacts/ScreenTextCopier-debug.apk
            artifacts/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
